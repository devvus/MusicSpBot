[project]
name = "anonxmusic"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.9.0",
    "pyrogram>=2.0.106",
    "pytgcrypto>=1.2.11",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "py-tgcalls>=2.3.3",
    "py-yt-search>=0.6.2",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.3.10",
]
